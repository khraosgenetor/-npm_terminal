<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>terminal test</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  </head>
  <body class="bg-black">
    <div id="root"></div>
    <script>
      const { useState, useRef, useEffect } = React;

      // ── paste dist/useTerminal.js logic inline (adapted for UMD) ──

      const BUILT_IN_HELP = [
        { text: "  clear     — clear the terminal", color: "text-zinc-400" },
        { text: "  echo      — print text", color: "text-zinc-400" },
        { text: "  date      — current date", color: "text-zinc-400" },
        { text: "  neofetch  — show banner", color: "text-zinc-400" },
      ];

      function useTerminal(banner, commands) {
        const [input, setInput] = useState("");
        const [history, setHistory] = useState([{ cmd: "", output: banner }]);
        const [cmdHistory, setCmdHistory] = useState([]);
        const [historyIndex, setHistoryIndex] = useState(-1);

        function runCommand(cmd) {
          const trimmed = cmd.trim();
          const lower = trimmed.toLowerCase();
          if (lower.startsWith("echo "))
            return [{ text: trimmed.slice(5), color: "text-zinc-400" }];
          if (lower === "date")
            return [{ text: new Date().toString(), color: "text-zinc-400" }];
          if (lower === "neofetch") return banner;
          if (lower === "help") {
            const userHelp = Object.keys(commands).map((name) => ({
              text: `  ${name}`,
              color: "text-zinc-400",
            }));
            return [
              { text: "available commands:", color: "text-white" },
              ...userHelp,
              ...BUILT_IN_HELP,
            ];
          }
          if (commands[lower]) return commands[lower]();
          return [
            { text: `command not found: ${trimmed}`, color: "text-red-400" },
          ];
        }

        function handleKey(e) {
          if (e.key === "ArrowUp") {
            e.preventDefault();
            if (cmdHistory.length === 0) return;
            const newIndex = Math.min(historyIndex + 1, cmdHistory.length - 1);
            setHistoryIndex(newIndex);
            setInput(cmdHistory[cmdHistory.length - 1 - newIndex]);
            return;
          }
          if (e.key === "ArrowDown") {
            e.preventDefault();
            if (historyIndex <= 0) {
              setHistoryIndex(-1);
              setInput("");
              return;
            }
            const newIndex = historyIndex - 1;
            setHistoryIndex(newIndex);
            setInput(cmdHistory[cmdHistory.length - 1 - newIndex]);
            return;
          }
          if (e.key !== "Enter") return;
          if (!input.trim()) return;
          setCmdHistory((prev) => [...prev, input]);
          setHistoryIndex(-1);
          if (input.trim() === "clear") {
            setHistory([{ cmd: "", output: banner }]);
          } else {
            setHistory((prev) => [
              ...prev,
              { cmd: input, output: runCommand(input) },
            ]);
          }
          setInput("");
        }

        return { input, setInput, history, handleKey };
      }

      // ── Terminal component ──

      const BANNER = [
        { text: "  terminal package test", color: "text-green-400" },
        { text: "  type 'help' to see commands", color: "text-zinc-500" },
      ];

      const commands = {
        whoami: () => [{ text: "khraos", color: "text-white" }],
        ping: () => [{ text: "pong", color: "text-green-400" }],
      };

      function Terminal({ banner, commands, prompt = "$ " }) {
        const { input, setInput, history, handleKey } = useTerminal(
          banner,
          commands,
        );
        const inputRef = useRef(null);
        const bottomRef = useRef(null);

        useEffect(() => {
          const el = inputRef.current;
          if (el) el.setSelectionRange(el.value.length, el.value.length);
        }, [input]);

        useEffect(() => {
          bottomRef.current?.scrollIntoView({ behavior: "smooth" });
        }, [history]);

        return React.createElement(
          "div",
          {
            tabIndex: 0,
            className:
              "min-h-screen bg-black text-white font-mono text-sm p-6 cursor-text",
            onClick: () => inputRef.current?.focus(),
          },
          history.map((entry, i) =>
            React.createElement(
              "div",
              { key: i, className: "mb-1" },
              entry.cmd &&
                React.createElement(
                  "p",
                  null,
                  React.createElement(
                    "span",
                    { className: "text-green-400" },
                    prompt,
                  ),
                  " " + entry.cmd,
                ),
              entry.output.map((line, j) =>
                React.createElement(
                  "pre",
                  {
                    key: j,
                    className: `${line.color} font-mono leading-tight`,
                  },
                  line.text,
                ),
              ),
            ),
          ),
          React.createElement(
            "div",
            { className: "flex items-center gap-2" },
            React.createElement(
              "span",
              { className: "text-green-400" },
              prompt,
            ),
            React.createElement("input", {
              ref: inputRef,
              value: input,
              onChange: (e) => setInput(e.target.value),
              onKeyDown: handleKey,
              className:
                "bg-transparent border-none outline-none text-white font-mono text-sm flex-1",
              autoFocus: true,
            }),
          ),
          React.createElement("div", { ref: bottomRef }),
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(
        React.createElement(Terminal, {
          banner: BANNER,
          commands,
          prompt: "~/test $",
        }),
      );
    </script>
  </body>
</html>
